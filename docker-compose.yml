version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: trimr-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - trimr-network
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trimr-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/trimr
      - JWT_SECRET=super_secret_trimr_saas_key_2026_jwt_token_key
      - FRONTEND_URL=http://localhost:5000
    depends_on:
      - mongodb
    networks:
      - trimr-network
    restart: always

volumes:
  mongodb_data:

networks:
  trimr-network:
    driver: bridge
